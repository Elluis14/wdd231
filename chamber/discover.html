<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discover San Miguel - Chamber of Commerce</title>
  <meta name="description" content="Discover local attractions, culture, and opportunities in San Miguel with the Chamber of Commerce.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">San Miguel Chamber</a>

    <button id="menu-btn" class="menu-btn" aria-label="Toggle navigation" aria-expanded="false">
      ☰
    </button>

    <nav id="main-nav" class="nav" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="directory.html">Directory</a></li>
        <li><a href="join.html">Join</a></li>
        <li class="active"><a href="discover.html" aria-current="page">Discover</a></li>
      </ul>
    </nav>
  </header>

  <main class="discover-layout">
    <!-- Mensaje de última visita (localStorage) -->
    <section class="panel visit-panel">
      <h1>Discover San Miguel</h1>
      <p id="visit-message" class="muted">
        Checking your last visit...
      </p>
      <p>
        Explore key locations, landmarks, and neighborhoods that make San Miguel a great place to live, work, and invest.
      </p>
    </section>

    <!-- Grid de tarjetas generadas desde JSON -->
    <section class="panel discover-grid-panel">
      <h2>Featured Places</h2>
      <div id="discover-grid" class="discover-grid" aria-live="polite">
        <!-- Las tarjetas se insertan aquí con JS -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> San Miguel Chamber</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>

  <script src="discover.js" type="module"></script>
</body>
</html>
